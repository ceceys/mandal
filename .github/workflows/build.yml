name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish portable (framework-dependent single exe)
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Publish for installer (self-contained)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-setup

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+') { $version = "0.0.0" }
          & $iscc "/DAppVersion=$version" setup\Mandal.iss

      - name: Checksums (the app verifies downloads against this file)
        shell: pwsh
        run: |
          $lines = foreach ($f in @("publish/Mandal.exe") + (Get-ChildItem dist/*.exe | ForEach-Object FullName)) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mandal
          path: |
            publish/Mandal.exe
            dist/*.exe
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Mandal.exe
            dist/*.exe
            SHA256SUMS.txt
          generate_release_notes: true
