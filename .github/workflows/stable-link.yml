name: Stable download link

# Manual: copies the latest release's Mandal-Setup-x.y.z.exe as Mandal-Setup.exe,
# so https://github.com/ceceys/mandal/releases/latest/download/Mandal-Setup.exe always works.
# New tag builds add this file themselves (see build.yml); this is for older releases.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Add Mandal-Setup.exe to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'Mandal-Setup-*.exe' -D dl
          cp dl/Mandal-Setup-*.exe Mandal-Setup.exe
          gh release upload "$tag" Mandal-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
